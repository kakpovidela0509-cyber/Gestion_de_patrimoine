<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Patrimmo</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%230F5C3F'/%3E%3Cpath d='M20 8 7.5 15.5h25L20 8Z' fill='white'/%3E%3Crect x='10.5' y='18' width='4' height='9' rx='1' fill='white'/%3E%3Crect x='18' y='18' width='4' height='9' rx='1' fill='white'/%3E%3Crect x='25.5' y='18' width='4' height='9' rx='1' fill='white'/%3E%3Crect x='7.5' y='29.5' width='25' height='3.5' rx='1.5' fill='white'/%3E%3C/svg%3E">
<style>
:root{--g:#0F5C3F;--bg:#F6F7F5;--ink:#14231B;--mut:#4B5A52;--bd:#E3E8E4}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg);font-size:14px}
a{color:var(--g)}
.shell{display:flex;min-height:100vh}
aside{width:240px;background:var(--g);padding:28px 20px;color:#fff;display:flex;flex-direction:column;gap:6px;flex-shrink:0}
aside h1{font-size:18px;margin:0 0 24px;line-height:1.3}
aside a.nav{display:block;padding:10px 12px;border-radius:8px;color:#E4EFE9;text-decoration:none}
aside a.on{background:rgba(255,255,255,.16);color:#fff;font-weight:600}
aside .me{margin-top:auto;font-size:13px;color:#E4EFE9;padding-top:16px}
aside .me button{margin-top:8px;background:none;border:1px solid #E4EFE9;color:#fff;border-radius:8px;padding:8px 12px;cursor:pointer;width:100%}
main{flex:1;padding:32px 40px;min-width:0}
h2{font-size:26px;margin:0}h3{margin:0 0 12px;font-size:16px}
.head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.card{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:24px;margin-bottom:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:16px}
.kpis .card{margin:0;padding:20px}
.lab{font-size:13px;color:var(--mut)}.val{font-size:15px;font-weight:600;margin:4px 0 16px}
.kpis .val{font-size:28px;font-weight:700;margin:6px 0 0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px}
.grid2i{display:grid;grid-template-columns:1fr 1fr;gap:0 24px}
.btn{height:42px;padding:0 18px;border-radius:8px;border:1px solid var(--g);background:var(--g);color:#fff;font-size:14px;font-weight:600;cursor:pointer}
.btn.ghost{background:#fff;color:var(--g)}.btn.danger{background:#fff;color:#7A1F16;border-color:#7A1F16}
.btn.sm{height:32px;padding:0 12px;font-size:13px}
table{width:100%;border-collapse:collapse;background:#fff}
.tw{background:#fff;border:1px solid var(--bd);border-radius:12px;overflow:auto;margin-bottom:16px}
th,td{padding:13px 16px;text-align:left;border-bottom:1px solid var(--bd);white-space:nowrap}
th{font-size:13px;color:var(--mut);background:var(--bg)}
tr.link{cursor:pointer}tr.link:hover{background:#F0F4F1}
.b{display:inline-block;padding:4px 10px;border-radius:12px;font-size:13px;font-weight:600}
.ok{background:#DCEFE4;color:#0B4A32}.w{background:#FBEFD0;color:#6B4A00}.e{background:#F8DDDA;color:#7A1F16}
input,select,textarea{width:100%;height:42px;border:1px solid #9AA89F;border-radius:8px;padding:0 12px;font-size:14px;background:#fff;font-family:inherit}
textarea{height:80px;padding:10px 12px}
label{display:block;font-weight:600;margin-bottom:14px}label input,label select,label textarea{margin-top:6px;font-weight:400}
.filters{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}.filters input{flex:1;min-width:220px}.filters select{width:auto}
.mut{color:var(--mut)}.err{color:#7A1F16;min-height:18px;margin:0 0 8px}
.bar{height:10px;border-radius:5px;background:var(--g);margin:6px 0 14px}
.track{height:12px;border-radius:6px;background:var(--bd);overflow:hidden}.track div{height:12px;background:var(--g)}
.ev{padding:2px 0 2px 14px;border-left:3px solid var(--g);margin-bottom:12px}
.modal{position:fixed;inset:0;background:rgba(20,35,27,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10;overflow:auto}
.modal form{width:100%;max-width:640px;margin:0;max-height:92vh;overflow-y:auto;padding-top:0}.modal h2{font-size:20px;margin:0 0 16px;padding:20px 0 12px;position:sticky;top:0;background:#fff;z-index:2;border-bottom:1px solid var(--bd)}.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}.fgrid .full{grid-column:1/-1}.modal .actions{position:sticky;bottom:0;background:#fff;padding:12px 0 4px;border-top:1px solid var(--bd);margin-top:4px;justify-content:flex-end}@media(max-width:600px){.fgrid{grid-template-columns:1fr}}
.login{display:flex;min-height:100vh}.login .l{flex:1;background:var(--g);color:#fff;padding:72px;display:flex;flex-direction:column;justify-content:space-between}
.login .l h1{font-size:40px;line-height:1.15;margin:0 0 16px}.login .r{flex:1;display:flex;align-items:center;justify-content:center;padding:32px}
.login form{width:100%;max-width:400px}.login h2{margin-bottom:8px}
.pager{display:flex;gap:10px;align-items:center;justify-content:flex-end;margin-bottom:16px}
@media(max-width:800px){.shell{flex-direction:column}aside{width:auto;flex-direction:row;flex-wrap:wrap}aside h1{width:100%;margin:0 0 8px}aside .me{width:100%;margin:0}main{padding:20px}.login .l{display:none}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const LOGO = (bg, fg, s = 36) => `<svg width="${s}" height="${s}" viewBox="0 0 40 40" fill="none" aria-hidden="true"><rect width="40" height="40" rx="10" fill="${bg}"/><path d="M20 8 7.5 15.5h25L20 8Z" fill="${fg}"/><rect x="10.5" y="18" width="4" height="9" rx="1" fill="${fg}"/><rect x="18" y="18" width="4" height="9" rx="1" fill="${fg}"/><rect x="25.5" y="18" width="4" height="9" rx="1" fill="${fg}"/><rect x="7.5" y="29.5" width="25" height="3.5" rx="1.5" fill="${fg}"/></svg>`;
const BRAND = (s = 36, size = 22) => `<div style="display:flex;align-items:center;gap:10px">${LOGO('#fff', '#0F5C3F', s)}<span style="font-size:${size}px;font-weight:800;letter-spacing:.3px">Patrimmo</span></div>`;
const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => (n === null || n === undefined || n === '') ? '—' : Number(n).toLocaleString('fr-FR');
const dt = d => d ? new Date(d).toLocaleDateString('fr-FR') : '—';
const TYPES = {administratif:'Bâtiment administratif', logement:'Logement de fonction', entrepot:'Entrepôt', local_technique:'Local technique'};
const ETATS = {bon:'Bon', a_rehabiliter:'À réhabiliter', degrade:'Dégradé', hors_service:'Hors service'};
const MV = {acquisition:'Acquisition', affectation:'Affectation', transfert:'Transfert', sortie:'Sortie du patrimoine'};
const ROLES = {admin:'Administrateur', gestionnaire:'Gestionnaire', responsable:'Responsable de service', controleur:'Contrôleur', direction:'Direction'};
const opts = o => Object.entries(o);
const badge = (t, k) => `<span class="b ${k}">${esc(t)}</span>`;
const etatBadge = e => badge(ETATS[e] || e, {bon:'ok', a_rehabiliter:'w', degrade:'e', hors_service:'e'}[e] || 'w');
const mvBadge = s => badge({en_attente:'En attente', valide:'Validé', refuse:'Refusé'}[s] || s, {en_attente:'w', valide:'ok', refuse:'e'}[s] || 'w');

let token = sessionStorage.getItem('token');
let user = JSON.parse(sessionStorage.getItem('user') || 'null');
let services = [];
const Q = {q:'', type:'', etat:'', page:1}, M = {statut:'', page:1}, MT = {page:1};
const can = (...r) => !!user && r.includes(user.role);

async function api(path, {method = 'GET', body, raw} = {}) {
  const r = await fetch('/api/' + path, {
    method,
    headers: {Accept:'application/json', 'Content-Type':'application/json', ...(token ? {Authorization:'Bearer ' + token} : {})},
    body: body ? JSON.stringify(body) : undefined
  });
  if (r.status === 401 && token && path !== 'auth/login') { logout(true); throw new Error('Session expirée.'); }
  if (raw) return r;
  const data = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(data.message || 'Une erreur est survenue.'); e.errors = data.errors; throw e; }
  return data;
}
const msg = e => e.errors ? Object.values(e.errors).flat().join(' ') : e.message;

function logout(silent) {
  if (!silent && token) api('auth/logout', {method:'POST'}).catch(() => {});
  token = null; user = null; sessionStorage.clear(); render();
}

function form(title, fields, onSubmit, label = 'Enregistrer') {
  const m = document.createElement('div');
  m.className = 'modal';
  const field = f => {
    const v = f.value ?? '';
    let c;
    if (f.type === 'select') c = `<select name="${f.name}">${(f.options || []).map(o => `<option value="${esc(o[0])}" ${String(o[0]) === String(v) ? 'selected' : ''}>${esc(o[1])}</option>`).join('')}</select>`;
    else if (f.type === 'textarea') c = `<textarea name="${f.name}">${esc(v)}</textarea>`;
    else c = `<input name="${f.name}" type="${f.type || 'text'}" value="${esc(v)}" ${f.required ? 'required' : ''} ${f.step ? `step="${f.step}"` : ''}>`;
    const full = f.type === 'textarea' || ['designation', 'adresse', 'libelle', 'nature', 'titre_propriete', 'name', 'email', 'bien_id'].includes(f.name);
    return `<label class="${full ? 'full' : ''}">${esc(f.label)}${f.required ? ' *' : ''}${c}</label>`;
  };
  m.innerHTML = `<form class="card"><h2>${esc(title)}</h2><div class="fgrid">${fields.map(field).join('')}</div><p class="err"></p><div class="row actions"><button type="button" class="btn ghost" data-close>Annuler</button><button class="btn">${label}</button></div></form>`;
  document.body.appendChild(m);
  m.querySelector('[data-close]').onclick = () => m.remove();
  m.querySelector('form').onsubmit = async e => {
    e.preventDefault();
    const v = {};
    new FormData(e.target).forEach((x, k) => { if (x !== '') v[k] = x; });
    try { await onSubmit(v); m.remove(); } catch (er) { m.querySelector('.err').textContent = msg(er); }
  };
}
const svcOpts = (vide) => [...(vide ? [['', vide]] : []), ...services.map(s => [s.id, s.nom])];
const biensOpts = async () => (await api('patrimoine/biens?per_page=500')).data.map(b => [b.id, b.code + ' · ' + b.designation]);
const pager = (d, setter) => d.last_page > 1 ? `<div class="pager"><button class="btn ghost sm" ${d.current_page <= 1 ? 'disabled' : ''} onclick="${setter}=${d.current_page - 1};render()">Précédent</button><span class="mut">Page ${d.current_page} sur ${d.last_page}</span><button class="btn ghost sm" ${d.current_page >= d.last_page ? 'disabled' : ''} onclick="${setter}=${d.current_page + 1};render()">Suivant</button></div>` : '';
const tbl = (heads, rows, link) => `<div class="tw"><table><tr>${heads.map(h => `<th>${h}</th>`).join('')}</tr>${rows.length ? rows.map(r => `<tr ${r.go ? `class="link" onclick="location.hash='${r.go}'"` : ''}>${r.c.map(c => `<td>${c}</td>`).join('')}</tr>`).join('') : `<tr><td colspan="${heads.length}" class="mut">Aucun résultat.</td></tr>`}</table></div>`;

/* ---------- Actions ---------- */
const actions = {
  newBien() {
    form('Nouveau bien immobilier', [
      {name:'designation', label:'Désignation', required:true},
      {name:'type', label:'Type', type:'select', options:opts(TYPES)},
      {name:'adresse', label:'Adresse / localisation', required:true},
      {name:'superficie', label:'Superficie (m²)', type:'number', step:'0.01'},
      {name:'date_acquisition', label:'Date d’acquisition', type:'date'},
      {name:'valeur', label:'Valeur (FCFA)', type:'number', step:'1'},
      {name:'titre_propriete', label:'Titre de propriété'},
      {name:'etat', label:'État', type:'select', options:opts(ETATS)},
      {name:'service_id', label:'Service affectataire', type:'select', options:svcOpts('— Aucun —')}
    ], async v => { await api('patrimoine/biens', {method:'POST', body:v}); render(); });
  },
  async editBien(id) {
    const b = await api('patrimoine/biens/' + id);
    form('Modifier le bien', [
      {name:'designation', label:'Désignation', value:b.designation, required:true},
      {name:'type', label:'Type', type:'select', options:opts(TYPES), value:b.type},
      {name:'adresse', label:'Adresse / localisation', value:b.adresse, required:true},
      {name:'superficie', label:'Superficie (m²)', type:'number', step:'0.01', value:b.superficie},
      {name:'date_acquisition', label:'Date d’acquisition', type:'date', value:(b.date_acquisition || '').slice(0, 10)},
      {name:'valeur', label:'Valeur (FCFA)', type:'number', step:'1', value:b.valeur},
      {name:'titre_propriete', label:'Titre de propriété', value:b.titre_propriete},
      {name:'etat', label:'État', type:'select', options:opts(ETATS), value:b.etat}
    ], async v => { await api('patrimoine/biens/' + id, {method:'PUT', body:v}); render(); });
  },
  async archiver(id) {
    if (!confirm('Archiver ce bien ? Il ne sera pas supprimé.')) return;
    await api('patrimoine/biens/' + id, {method:'DELETE'}); location.hash = '#/biens';
  },
  mouvement(bienId, type, bienOptions) {
    const f = [];
    if (bienOptions) f.push({name:'bien_id', label:'Bien immobilier', type:'select', options:bienOptions});
    if (!bienOptions) f.push({name:'type', label:'Opération', type:'select', options:[[type, MV[type]]], value:type});
    else f.push({name:'type', label:'Opération', type:'select', options:[['affectation','Affectation'], ['transfert','Transfert'], ['sortie','Sortie du patrimoine']]});
    f.push({name:'service_destination_id', label:'Service destinataire (sauf sortie)', type:'select', options:svcOpts('— Choisir —')});
    f.push({name:'motif', label:'Motif', type:'textarea'});
    form('Demande d’opération', f, async v => {
      if (!bienOptions) v.bien_id = bienId;
      await api('patrimoine/mouvements', {method:'POST', body:v}); render();
    }, 'Soumettre pour validation');
  },
  async nouvelleOperation() { actions.mouvement(null, 'affectation', await biensOpts()); },
  async traiter(id, action) { try { await api(`patrimoine/mouvements/${id}/${action}`, {method:'POST'}); render(); } catch (e) { alert(msg(e)); } },
  newCampagne() {
    form('Lancer une campagne d’inventaire', [
      {name:'libelle', label:'Libellé', required:true, value:'Inventaire annuel'},
      {name:'annee', label:'Année', type:'number', value:new Date().getFullYear(), required:true}
    ], async v => { const c = await api('inventaire/inventaires', {method:'POST', body:v}); location.hash = '#/inventaires/' + c.id; });
  },
  async constat(invId) {
    form('Enregistrer un constat', [
      {name:'bien_id', label:'Bien immobilier', type:'select', options:await biensOpts()},
      {name:'constat', label:'Constat', type:'select', options:[['present','Présent, en bon état'], ['degrade','Présent, dégradé'], ['absent','Introuvable']]},
      {name:'commentaire', label:'Commentaire', type:'textarea'}
    ], async v => { await api(`inventaire/inventaires/${invId}/lignes`, {method:'POST', body:v}); render(); });
  },
  async cloturer(id) {
    if (!confirm('Clôturer cette campagne ? Plus aucun constat ne pourra être ajouté.')) return;
    await api(`inventaire/inventaires/${id}/cloturer`, {method:'POST'}); render();
  },
  async incident() {
    form('Déclarer un incident', [
      {name:'bien_id', label:'Bien immobilier', type:'select', options:await biensOpts()},
      {name:'nature', label:'Nature des travaux', required:true},
      {name:'date_intervention', label:'Date', type:'date'},
      {name:'prestataire', label:'Prestataire'},
      {name:'cout', label:'Coût estimé (FCFA)', type:'number', step:'1'}
    ], async v => { await api('patrimoine/maintenances', {method:'POST', body:v}); render(); });
  },
  async statutMaint(id, statut) { await api('patrimoine/maintenances/' + id, {method:'PUT', body:{statut}}); render(); },
  async rapport(type, csv) {
    if (csv) {
      const r = await api(`inventaire/rapports/${type}?format=csv`, {raw:true});
      const a = document.createElement('a');
      a.href = URL.createObjectURL(await r.blob()); a.download = `rapport-${type}.csv`; a.click(); return;
    }
    const d = await api(`inventaire/rapports/${type}`);
    $('#apercu').innerHTML = `<h3>Aperçu : ${d.total} bien(s)</h3>` + tbl(['Code', 'Désignation', 'Type', 'Service', 'Superficie', 'État'],
      d.lignes.map(l => ({c:[esc(l.code), esc(l.designation), esc(TYPES[l.type] || l.type), esc(l.service), l.superficie ? fmt(l.superficie) + ' m²' : '—', etatBadge(l.etat)]})));
  },
  newUser() {
    form('Nouveau compte', [
      {name:'name', label:'Nom', required:true}, {name:'email', label:'E-mail', type:'email', required:true},
      {name:'password', label:'Mot de passe (8 caractères min.)', type:'password', required:true},
      {name:'role', label:'Rôle', type:'select', options:opts(ROLES)}
    ], async v => { await api('auth/users', {method:'POST', body:v}); render(); });
  },
  async delUser(id) { if (!confirm('Supprimer ce compte ?')) return; try { await api('auth/users/' + id, {method:'DELETE'}); render(); } catch (e) { alert(msg(e)); } }
};

/* ---------- Vues ---------- */
const VIEWS = {
  async dashboard() {
    const s = await api('patrimoine/stats');
    const types = Object.entries(s.par_type || {});
    const max = Math.max(1, ...types.map(t => t[1]));
    return `<div class="head"><h2>Tableau de bord</h2></div>
    <div class="kpis"><div class="card"><div class="lab">Biens immobiliers</div><div class="val">${fmt(s.total)}</div></div>
    <div class="card"><div class="lab">Superficie totale (m²)</div><div class="val">${fmt(s.superficie_totale)}</div></div>
    <div class="card"><div class="lab">Biens à réhabiliter</div><div class="val" style="color:#6B4A00">${fmt(s.a_rehabiliter)}</div></div></div>
    <div class="grid2"><div class="card"><h3>Répartition par type</h3>${types.length ? types.map(([t, n]) => `<div class="lab">${esc(TYPES[t] || t)} (${n})</div><div class="bar" style="width:${Math.round(n / max * 100)}%"></div>`).join('') : '<p class="mut">Aucun bien enregistré.</p>'}</div>
    <div class="card"><h3>Derniers mouvements</h3>${(s.derniers_mouvements || []).map(m => `<div class="ev"><b>${esc(m.bien ? m.bien.code : '')}</b> · ${esc(MV[m.type] || m.type)} ${mvBadge(m.statut)}<div class="lab">${dt(m.created_at)}</div></div>`).join('') || '<p class="mut">Aucun mouvement.</p>'}</div></div>`;
  },
  async biens(id) {
    if (id) return VIEWS.fiche(id);
    const p = new URLSearchParams({page:Q.page});
    ['q', 'type', 'etat'].forEach(k => { if (Q[k]) p.set(k, Q[k]); });
    const d = await api('patrimoine/biens?' + p);
    return `<div class="head"><h2>Biens immobiliers</h2>${can('admin', 'gestionnaire') ? `<button class="btn" onclick="actions.newBien()">Nouveau bien</button>` : ''}</div>
    <div class="filters"><input id="q" placeholder="Rechercher par code ou désignation" value="${esc(Q.q)}" onkeydown="if(event.key==='Enter'){Q.q=this.value;Q.page=1;render()}">
    <select onchange="Q.type=this.value;Q.page=1;render()"><option value="">Tous les types</option>${opts(TYPES).map(o => `<option value="${o[0]}" ${Q.type === o[0] ? 'selected' : ''}>${o[1]}</option>`).join('')}</select>
    <select onchange="Q.etat=this.value;Q.page=1;render()"><option value="">Tous les états</option>${opts(ETATS).map(o => `<option value="${o[0]}" ${Q.etat === o[0] ? 'selected' : ''}>${o[1]}</option>`).join('')}</select>
    <button class="btn ghost" onclick="Q.q=$('#q').value;Q.page=1;render()">Rechercher</button></div>
    ${tbl(['Code', 'Désignation', 'Type', 'Localisation', 'Superficie', 'Service', 'État'], d.data.map(b => ({go:'#/biens/' + b.id, c:[esc(b.code), esc(b.designation), esc(TYPES[b.type] || b.type), esc(b.adresse), b.superficie ? fmt(b.superficie) + ' m²' : '—', esc(b.service ? b.service.nom : '—'), etatBadge(b.etat)]})))}
    ${pager(d, 'Q.page')}`;
  },
  async fiche(id) {
    const b = await api('patrimoine/biens/' + id);
    const info = (l, v) => `<div><div class="lab">${l}</div><div class="val">${v}</div></div>`;
    const actif = b.statut === 'actif';
    return `<p><a href="#/biens">← Biens immobiliers</a></p>
    <div class="head"><h2>${esc(b.designation)} ${actif ? '' : badge(b.statut === 'sorti' ? 'Sorti du patrimoine' : 'Archivé', 'e')}</h2><div class="row">
    ${actif && can('admin', 'gestionnaire', 'responsable') ? `<button class="btn ghost" onclick="actions.mouvement(${b.id},'affectation')">Affecter</button><button class="btn ghost" onclick="actions.mouvement(${b.id},'transfert')">Transférer</button><button class="btn danger" onclick="actions.mouvement(${b.id},'sortie')">Proposer la sortie</button>` : ''}
    ${actif && can('admin', 'gestionnaire') ? `<button class="btn ghost" onclick="actions.editBien(${b.id})">Modifier</button><button class="btn danger" onclick="actions.archiver(${b.id})">Archiver</button>` : ''}</div></div>
    <div class="grid2"><div class="card grid2i">${info('Code d’inventaire', esc(b.code))}${info('Service affectataire', esc(b.service ? b.service.nom : '—'))}
    ${info('Type', esc(TYPES[b.type] || b.type))}${info('État', etatBadge(b.etat))}${info('Localisation', esc(b.adresse))}${info('Superficie', b.superficie ? fmt(b.superficie) + ' m²' : '—')}
    ${info('Date d’acquisition', dt(b.date_acquisition))}${info('Valeur comptable (FCFA)', fmt(b.valeur))}${info('Titre de propriété', esc(b.titre_propriete || '—'))}</div>
    <div class="card"><h3>Historique des mouvements</h3>${b.mouvements.map(m => `<div class="ev"><b>${esc(MV[m.type] || m.type)}</b> ${mvBadge(m.statut)}<div class="lab">${m.origine ? esc(m.origine.nom) + ' → ' : ''}${m.destination ? esc(m.destination.nom) : ''} · ${dt(m.created_at)}</div>${m.motif ? `<div class="lab">${esc(m.motif)}</div>` : ''}</div>`).join('') || '<p class="mut">Aucun mouvement.</p>'}</div></div>
    <div class="card"><h3>Maintenance</h3>${b.maintenances.map(m => `<div class="ev"><b>${esc(m.nature)}</b> ${badge({en_cours:'En cours', terminee:'Terminée', expertise:'Expertise requise'}[m.statut] || m.statut, m.statut === 'terminee' ? 'ok' : 'w')}<div class="lab">${dt(m.date_intervention)} · ${esc(m.prestataire || '—')}</div></div>`).join('') || '<p class="mut">Aucune intervention.</p>'}</div>`;
  },
  async affectations() {
    const p = new URLSearchParams({page:M.page}); if (M.statut) p.set('statut', M.statut);
    const d = await api('patrimoine/mouvements?' + p);
    return `<div class="head"><h2>Affectations et transferts</h2>${can('admin', 'gestionnaire', 'responsable') ? `<button class="btn" onclick="actions.nouvelleOperation()">Nouvelle opération</button>` : ''}</div>
    <div class="filters"><select onchange="M.statut=this.value;M.page=1;render()"><option value="">Tous les statuts</option>${[['en_attente', 'En attente'], ['valide', 'Validés'], ['refuse', 'Refusés']].map(o => `<option value="${o[0]}" ${M.statut === o[0] ? 'selected' : ''}>${o[1]}</option>`).join('')}</select></div>
    ${tbl(['Date', 'Bien', 'Opération', 'De → Vers', 'Statut', ''], d.data.map(m => ({c:[dt(m.created_at), esc(m.bien ? m.bien.code + ' · ' + m.bien.designation : ''), esc(MV[m.type] || m.type), esc((m.origine ? m.origine.nom : '—') + ' → ' + (m.destination ? m.destination.nom : '—')), mvBadge(m.statut),
      m.statut === 'en_attente' && can('admin', 'direction') ? `<button class="btn sm" onclick="actions.traiter(${m.id},'valider')">Valider</button> <button class="btn ghost sm" onclick="actions.traiter(${m.id},'refuser')">Refuser</button>` : '']})))}
    ${pager(d, 'M.page')}`;
  },
  async inventaires(id) {
    if (id) {
      const i = await api('inventaire/inventaires/' + id);
      const r = {conforme:['Conforme', 'ok'], a_verifier:['À vérifier', 'w'], ecart:['Écart', 'e']};
      return `<p><a href="#/inventaires">← Inventaires</a></p>
      <div class="head"><h2>${esc(i.libelle)} · ${i.annee}</h2><div class="row">${i.statut === 'en_cours' && can('admin', 'gestionnaire', 'controleur') ? `<button class="btn" onclick="actions.constat(${i.id})">Enregistrer un constat</button>` : ''}${i.statut === 'en_cours' && can('admin', 'gestionnaire') ? `<button class="btn ghost" onclick="actions.cloturer(${i.id})">Clôturer</button>` : badge(i.statut === 'cloturee' ? 'Clôturée' : 'En cours', i.statut === 'cloturee' ? 'ok' : 'w')}</div></div>
      <div class="card"><div class="row" style="justify-content:space-between"><b>Avancement</b><b>${i.progression ?? '—'} %</b></div><div class="track" style="margin-top:10px"><div style="width:${i.progression || 0}%"></div></div><p class="mut">${i.lignes.length} bien(s) constaté(s) sur ${i.total_biens ?? '?'}</p></div>
      ${tbl(['Code', 'Désignation', 'Constat', 'Résultat', 'Commentaire'], i.lignes.map(l => ({c:[esc(l.bien_code), esc(l.bien_designation), esc({present:'Présent', degrade:'Dégradé', absent:'Introuvable'}[l.constat] || l.constat), badge(...(r[l.resultat] || [l.resultat, 'w'])), esc(l.commentaire || '')]})))}`;
    }
    const l = await api('inventaire/inventaires');
    return `<div class="head"><h2>Inventaires</h2>${can('admin', 'gestionnaire') ? `<button class="btn" onclick="actions.newCampagne()">Lancer une campagne</button>` : ''}</div>
    ${tbl(['Campagne', 'Année', 'Statut', 'Biens constatés'], l.map(i => ({go:'#/inventaires/' + i.id, c:[esc(i.libelle), i.annee, badge(i.statut === 'cloturee' ? 'Clôturée' : 'En cours', i.statut === 'cloturee' ? 'ok' : 'w'), i.lignes_count]})))}`;
  },
  async maintenance() {
    const d = await api('patrimoine/maintenances?page=' + MT.page);
    const st = {en_cours:['En cours', 'w'], terminee:['Terminée', 'ok'], expertise:['Expertise requise', 'e']};
    return `<div class="head"><h2>Maintenance</h2>${can('admin', 'gestionnaire') ? `<button class="btn" onclick="actions.incident()">Déclarer un incident</button>` : ''}</div>
    ${tbl(['Bien', 'Nature des travaux', 'Date', 'Prestataire', 'Coût (FCFA)', 'Statut', ''], d.data.map(m => ({c:[esc(m.bien ? m.bien.code + ' · ' + m.bien.designation : ''), esc(m.nature), dt(m.date_intervention), esc(m.prestataire || '—'), fmt(m.cout), badge(...(st[m.statut] || [m.statut, 'w'])),
      m.statut !== 'terminee' && can('admin', 'gestionnaire') ? `<button class="btn ghost sm" onclick="actions.statutMaint(${m.id},'terminee')">Terminer</button>` : '']})))}
    ${pager(d, 'MT.page')}`;
  },
  async rapports() {
    const R = [['inventaire-general', 'Inventaire immobilier', 'Liste complète des biens avec leur superficie, leur valeur et leur état.'], ['biens-par-service', 'Biens par service', 'Répartition du patrimoine immobilier entre les services.'], ['a-rehabiliter', 'Biens à réhabiliter', 'Biens dégradés ou nécessitant des travaux importants.']];
    return `<div class="head"><h2>Rapports</h2></div><div class="grid2">${R.map(r => `<div class="card"><h3>${r[1]}</h3><p class="mut">${r[2]}</p><div class="row"><button class="btn ghost sm" onclick="actions.rapport('${r[0]}')">Aperçu</button><button class="btn sm" onclick="actions.rapport('${r[0]}',true)">Télécharger (Excel)</button></div></div>`).join('')}</div><div id="apercu"></div>`;
  },
  async utilisateurs() {
    if (!can('admin')) return '<p class="mut">Accès réservé à l’administrateur.</p>';
    const u = await api('auth/users');
    return `<div class="head"><h2>Utilisateurs</h2><button class="btn" onclick="actions.newUser()">Nouveau compte</button></div>
    ${tbl(['Nom', 'E-mail', 'Rôle', ''], u.map(x => ({c:[esc(x.name), esc(x.email), esc(ROLES[x.role] || x.role), x.id !== user.id ? `<button class="btn danger sm" onclick="actions.delUser(${x.id})">Supprimer</button>` : '']})))}`;
  }
};

const NAV = [['dashboard', 'Tableau de bord'], ['biens', 'Biens immobiliers'], ['affectations', 'Affectations'], ['inventaires', 'Inventaires'], ['maintenance', 'Maintenance'], ['rapports', 'Rapports'], ['utilisateurs', 'Utilisateurs']];

function loginView() {
  return `<div class="login"><div class="l">${BRAND(44, 28)}<div><h1>Un inventaire fiable,<br>des bâtiments tracés.</h1><p>Suivez chaque bien immobilier public de son acquisition à sa sortie du patrimoine.</p></div><span>Version 1.0</span></div>
  <div class="r"><form id="lf"><div style="display:flex;align-items:center;gap:10px;margin-bottom:24px">${LOGO('#0F5C3F', '#fff', 40)}<b style="font-size:24px;color:#0F5C3F">Patrimmo</b></div><h2>Connexion</h2><p class="mut" style="margin-bottom:24px">Accédez à votre espace de gestion du patrimoine.</p>
  <label>Adresse e-mail<input name="email" type="email" required autofocus></label><label>Mot de passe<input name="password" type="password" required></label>
  <p class="err" id="lerr"></p><button class="btn" style="width:100%">Se connecter</button></form></div></div>`;
}

async function render() {
  document.querySelectorAll('.modal').forEach(m => m.remove());
  const app = $('#app');
  if (!token) {
    app.innerHTML = loginView();
    $('#lf').onsubmit = async e => {
      e.preventDefault();
      const v = Object.fromEntries(new FormData(e.target));
      try {
        const r = await api('auth/login', {method:'POST', body:v});
        token = r.token; user = r.user;
        sessionStorage.setItem('token', token); sessionStorage.setItem('user', JSON.stringify(user));
        location.hash = '#/dashboard'; render();
      } catch (er) { $('#lerr').textContent = msg(er); }
    };
    return;
  }
  const [page, id] = (location.hash.replace('#/', '') || 'dashboard').split('/');
  const nav = NAV.filter(n => n[0] !== 'utilisateurs' || can('admin'));
  app.innerHTML = `<div class="shell"><aside><div style="margin-bottom:6px">${BRAND(36, 22)}</div><div style="font-size:12px;color:#E4EFE9;margin-bottom:22px">Patrimoine immobilier de l’État</div>${nav.map(n => `<a class="nav ${n[0] === page ? 'on' : ''}" href="#/${n[0]}">${n[1]}</a>`).join('')}<div class="me"><b>${esc(user.name)}</b><br>${esc(ROLES[user.role] || user.role)}<button onclick="logout()">Se déconnecter</button></div></aside><main><p class="mut">Chargement…</p></main></div>`;
  try {
    if (!services.length) services = await api('patrimoine/services');
    $('main').innerHTML = await (VIEWS[page] || VIEWS.dashboard)(id);
  } catch (e) {
    if (token) $('main').innerHTML = `<div class="card"><h3>Une erreur est survenue</h3><p class="err">${esc(msg(e))}</p></div>`;
  }
}
window.addEventListener('hashchange', render);
render();
</script>
</body>
</html>
